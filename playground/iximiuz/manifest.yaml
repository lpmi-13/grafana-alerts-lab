        <!doctype html>
        <html lang="en">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Alert inbox</title>
        <style>
          :root{font-family:system-ui,sans-serif;color-scheme:dark;background:#111827;color:#f9fafb}
          body{margin:0;padding:1.4rem;max-width:900px}h1{margin:.2rem 0}p{color:#cbd5e1;line-height:1.5}
          button{border:0;border-radius:8px;padding:.7rem 1rem;font-weight:700;cursor:pointer;margin:.3rem .4rem .3rem 0}
          #break{background:#ef4444;color:white}#restore{background:#34d399;color:#052e23}
          #status{min-height:1.5rem}.event{border:1px solid #334155;border-radius:10px;padding:1rem;margin:.6rem 0}
          .firing{border-color:#ef4444}.resolved{border-color:#34d399}.muted{color:#94a3b8}
          dialog{background:#1f2937;color:white;border:2px solid #ef4444;border-radius:14px;max-width:520px;box-shadow:0 12px 60px #0009}
          dialog::backdrop{background:#0009}dialog button{background:#e5e7eb;color:#111827}
          .destination{border:1px solid #334155;border-radius:10px;padding:1rem;margin:.6rem 0}
          .destination label{display:block;font-weight:700;margin-bottom:.4rem}
          .destination input{box-sizing:border-box;width:100%;padding:.65rem;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#f9fafb;font:inherit}
          .destination p{margin:.4rem 0}.save{background:#60a5fa;color:#0b1220}.remove{background:#374151;color:#f9fafb}
        </style>
        <h1>Alert inbox</h1>
        <p>Grafana sends its webhook here. Trigger a checkout fault, watch its metrics in Grafana, then see the alert arrive in this tab.</p>
        <button id="break">Trigger checkout fault</button><button id="restore">Restore checkout</button>
        <p id="status" role="status">Waiting for Grafana notifications…</p>
        <h2>Your destinations</h2>
        <p>Grafana's <strong>Lab alerts</strong> contact point always notifies this inbox. Add your own destinations and Grafana notifies them too. They last for this playground session only.</p>
        <p class="muted">Prefer to set up the alert yourself? Sign in to the Grafana tab as <code>admin</code> / <code>lab-demo</code>. Use <strong>Alerts &amp; IRM → Alerting → Notification configuration → Contact points</strong> to create a Webhook contact point, then <strong>Alert rules → New alert rule</strong> to create a rule and select that contact point.</p>
        <form class="destination" data-kind="webhook">
          <label for="webhook-url">Webhook URL</label>
          <input id="webhook-url" name="url" type="url" required placeholder="https://ntfy.sh/your-hard-to-guess-topic">
          <p class="muted">Discord and Slack webhook URLs use Grafana's Discord and Slack integrations. ntfy.sh topics get ntfy's Grafana template, so subscribe to the topic in the ntfy phone app to get a push notification. Any other URL receives Grafana's webhook JSON. Anyone who can open this session's Grafana can read a plain webhook URL; Discord and Slack URLs are masked.</p>
          <button class="save">Save webhook</button><button class="remove" type="button">Remove</button>
          <p class="state" role="status">Checking Grafana…</p>
        </form>
        <form class="destination" data-kind="pagerduty">
          <label for="pagerduty-key">PagerDuty integration key</label>
          <input id="pagerduty-key" name="key" type="password" required autocomplete="off" spellcheck="false" minlength="32" maxlength="32" placeholder="32 character Events API v2 key">
          <p class="muted">Create an Events API v2 integration on a PagerDuty service and paste its integration key. Grafana stores it as a masked secret.</p>
          <button class="save">Save PagerDuty key</button><button class="remove" type="button">Remove</button>
          <p class="state" role="status">Checking Grafana…</p>
        </form>
        <h2>Notifications</h2><div id="events" aria-live="polite"></div>
        <dialog id="popup"><h2 id="popup-title"></h2><p id="popup-body"></p><button id="close">Dismiss</button></dialog>
        <script>
        const status=document.getElementById('status'),list=document.getElementById('events'),popup=document.getElementById('popup');
        let seen=Number(sessionStorage.getItem('seenAlert')||0),initialized=false;
        async function fault(mode){
          status.textContent='Updating checkout…';
          try{const r=await fetch('/api/fault/'+mode,{method:'POST'});if(!r.ok)throw Error(await r.text());
            status.textContent=mode==='on'?'Checkout fault enabled. Grafana evaluates every 10 seconds; allow a short delay for the webhook.':'Checkout restored. Watch for the resolved notification.';
          }catch(e){status.textContent='Could not update checkout: '+e.message;}
        }
        document.getElementById('break').onclick=()=>fault('on');
        document.getElementById('restore').onclick=()=>fault('off');
        document.getElementById('close').onclick=()=>popup.close();
        async function refresh(){
          try{
            const r=await fetch('/api/events',{cache:'no-store'});if(!r.ok)throw Error('receiver unavailable');
            const events=await r.json();list.replaceChildren();
            for(const e of [...events].reverse()){
              const row=document.createElement('div');row.className='event '+e.status;
              const title=document.createElement('strong');title.textContent=e.status.toUpperCase()+' · '+e.title;
              const detail=document.createElement('p');detail.textContent=e.time+' · '+e.service+' · '+e.message;
              row.append(title,detail);list.append(row);
            }
            if(!events.length){list.textContent='No notifications yet.';}
            const latest=events.at(-1);
            if(latest && latest.id>seen){
              seen=latest.id;sessionStorage.setItem('seenAlert',String(seen));
              if(latest.status==='firing'){
                document.getElementById('popup-title').textContent='🚨 '+latest.title;
                document.getElementById('popup-body').textContent='Grafana reports '+latest.service+' is firing. Inspect the dashboard and alert rule, then restore checkout.';
                if(!popup.open)popup.showModal();
              }else if(initialized){status.textContent='Grafana reports the alert is '+latest.status+'.';}
            }
            initialized=true;
          }catch(e){status.textContent='Alert inbox connection lost: '+e.message;}
        }
        refresh();setInterval(refresh,2000);
        const forms=[...document.querySelectorAll('form[data-kind]')];
        function showDestinations(configured){
          for(const form of forms){const label=configured[form.dataset.kind];form.querySelector('.state').textContent=label?'Active: '+label+'.':'Not configured.';}
        }
        async function destinations(path='',options={}){
          const r=await fetch('/api/destinations'+path,{cache:'no-store',...options});
          const data=await r.json().catch(()=>({error:r.statusText}));
          if(!r.ok)throw Object.assign(Error(data.error||r.statusText),{status:r.status});
          showDestinations(data);
        }
        async function loadDestinations(){
          try{await destinations();}
          catch(e){for(const form of forms)form.querySelector('.state').textContent=e.message;if(e.status===503)setTimeout(loadDestinations,3000);}
        }
        for(const form of forms){
          const kind=form.dataset.kind,input=form.querySelector('input'),state=form.querySelector('.state');
          async function change(method,body,verb){
            state.textContent=verb+'…';
            try{await destinations('/'+kind,{method,headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});if(body)input.value='';}
            catch(e){state.textContent='Could not update: '+e.message;}
          }
          form.onsubmit=e=>{e.preventDefault();change('POST',{[input.name]:input.value.trim()},'Saving');};
          form.querySelector('.remove').onclick=()=>change('DELETE',null,'Removing');
        }
        loadDestinations();
        </script>
        </html>
      machines:
        - "monitor-01"
    -
      path: "/etc/systemd/system/lab-alert-viewer.service"
      owner: "root"
      mode: "644"
      content: |
        [Unit]
        Description=Metrics lab alert inbox
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=simple
        User=laborant
        Environment=CHECKOUT_URL=http://172.16.0.2:9103
        ExecStart=/usr/bin/python3 /opt/grafana-alerts-lab/alert_viewer.py
        Restart=always
        RestartSec=2

        [Install]
        WantedBy=multi-user.target
      machines:
        - "monitor-01"
    -
      path: "/opt/grafana-alerts-lab/grafana/provisioning/datasources/prometheus.yaml"
      owner: "root"
      mode: "644"
      content: |
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: lab-prometheus
            type: prometheus
            access: proxy
            url: http://127.0.0.1:9090
            isDefault: true
            editable: false
      machines:
        - "monitor-01"
    -
      path: "/opt/grafana-alerts-lab/grafana/provisioning/dashboards/lab.yaml"
      owner: "root"
      mode: "644"
      content: |
        apiVersion: 1
        providers:
          - name: Lab
            orgId: 1
            folder: Lab
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /etc/grafana/dashboards
      machines:
        - "monitor-01"
    -
      path: "/opt/grafana-alerts-lab/grafana/provisioning/alerting/checkout.yaml"
      owner: "root"
      mode: "644"
      content: |
        apiVersion: 1
        # The contact point and notification policy are created by alert_viewer.py
        # through Grafana's provisioning API, so learners can add destinations at runtime.
        groups:
          - orgId: 1
            name: checkout
            folder: Lab
            interval: 10s
            rules:
              - uid: checkout_error_ratio
                title: Checkout error ratio is high
                condition: C
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 60
                      to: 0
                    datasourceUid: lab-prometheus
                    model:
                      datasource:
                        type: prometheus
                        uid: lab-prometheus
                      editorMode: code
                      expr: 'lab_service_error_ratio{service="checkout"}'
                      instant: true
                      range: false
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: A
                  - refId: B
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      reducer: last
                      type: reduce
                      refId: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: C
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      type: threshold
                      conditions:
                        - evaluator:
                            params: [0.2]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [C]
                          reducer:
                            params: []
                            type: last
                          type: query
                      refId: C
                      intervalMs: 1000
                      maxDataPoints: 43200
                noDataState: NoData
                execErrState: Error
                for: 0s
                annotations:
                  summary: Checkout error ratio exceeded 20 percent
                labels:
                  service: checkout
                  severity: warning
      machines:
        - "monitor-01"
    -
      path: "/opt/grafana-alerts-lab/grafana/dashboards/lab.json"
      owner: "root"
      mode: "644"
      content: |
        {
          "uid": "metrics-lab",
          "title": "Service metrics lab",
          "tags": ["lab", "services"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "5s",
          "time": {"from": "now-15m", "to": "now"},
          "panels": [
            {
              "id": 1,
              "title": "Services up",
              "type": "stat",
              "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0},
              "datasource": {"type": "prometheus", "uid": "lab-prometheus"},
              "targets": [{"refId": "A", "expr": "sum(up{job=\"lab-services\"})", "instant": true}],
              "fieldConfig": {"defaults": {"min": 0, "max": 5}, "overrides": []},
              "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
            },
            {
              "id": 2,
              "title": "Checkout error ratio",
              "type": "stat",
              "gridPos": {"h": 6, "w": 8, "x": 8, "y": 0},
              "datasource": {"type": "prometheus", "uid": "lab-prometheus"},
              "targets": [{"refId": "A", "expr": "lab_service_error_ratio{service=\"checkout\"}", "instant": true}],
              "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 0.2}]}}, "overrides": []},
              "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
            },
            {
              "id": 3,
              "title": "Errors by service (per second)",
              "type": "timeseries",
              "gridPos": {"h": 9, "w": 24, "x": 0, "y": 6},
              "datasource": {"type": "prometheus", "uid": "lab-prometheus"},
              "targets": [{"refId": "A", "expr": "sum by (service) (rate(lab_service_requests_total{status=\"error\"}[1m]))", "legendFormat": "{{service}}"}],
              "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
            },
            {
              "id": 4,
              "title": "Requests by service (per second)",
              "type": "timeseries",
              "gridPos": {"h": 9, "w": 24, "x": 0, "y": 15},
              "datasource": {"type": "prometheus", "uid": "lab-prometheus"},
              "targets": [{"refId": "A", "expr": "sum by (service) (rate(lab_service_requests_total[1m]))", "legendFormat": "{{service}}"}],
              "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
            }
          ]
        }
      machines:
        - "monitor-01"
    -
      path: "/opt/grafana-alerts-lab/prometheus.yml"
      owner: "root"
      mode: "644"
      content: |
        global:

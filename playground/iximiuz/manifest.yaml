    -
      path: "/opt/grafana-alerts-lab/grafana/provisioning/alerting/checkout.yaml"
      owner: "root"
      mode: "644"
      content: |
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: Lab alert inbox
            receivers:
              - uid: lab_webhook
                type: webhook
                settings:
                  url: http://127.0.0.1:8081/webhook
                  httpMethod: POST
        policies:
          - orgId: 1
            receiver: Lab alert inbox
            group_by: [grafana_folder, alertname]
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 1h
        groups:
          - orgId: 1
            name: checkout
            folder: Lab
            interval: 10s
            rules:
              - uid: checkout_error_ratio
                title: Checkout error ratio is high
                condition: C
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 60
                      to: 0
                    datasourceUid: lab-prometheus
                    model:
                      datasource:
                        type: prometheus
                        uid: lab-prometheus
                      editorMode: code
                      expr: 'lab_service_error_ratio{service="checkout"}'
                      instant: true
                      range: false
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: A
                  - refId: B
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      reducer: last
                      type: reduce
                      refId: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: C
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      type: threshold
                      conditions:
                        - evaluator:
                            params: [0.2]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [C]
                          reducer:
                            params: []
                            type: last
                          type: query
                      refId: C
                      intervalMs: 1000
                      maxDataPoints: 43200
                noDataState: NoData
                execErrState: Error
                for: 0s
                annotations:
                  summary: Checkout error ratio exceeded 20 percent
                labels:
                  service: checkout
                  severity: warning
      machines:

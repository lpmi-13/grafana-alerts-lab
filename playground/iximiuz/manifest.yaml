    -
      path: "/opt/grafana-alerts-lab/grafana/dashboards/lab.json"
      owner: "root"
      mode: "644"
      content: |
        {
          "uid": "metrics-lab",
          "title": "Service metrics lab",
          "tags": ["lab", "services"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "5s",
          "time": {"from": "now-15m", "to": "now"},
          "panels": [
            {
              "id": 1,
              "title": "Services up",
              "type": "stat",
              "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0},
              "datasource": {"type": "prometheus", "uid": "lab-prometheus"},
              "targets": [{"refId": "A", "expr": "sum(up{job=\"lab-services\"})", "instant": true}],
              "fieldConfig": {"defaults": {"min": 0, "max": 5}, "overrides": []},
              "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
            },
            {
